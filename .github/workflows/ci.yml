name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTC_BOOTSTRAP: dll_syringe
jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install Rust and maintenance tools
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          python -m pip install -r requirements-maintenance.txt
      - name: Checkout safety regression
        run: python tools/test_repo_bridge.py
      - name: Prepare pinned public source context
        shell: bash
        run: |
          git -c core.autocrlf=false clone --quiet --depth 1 https://github.com/LI-NA/zed-i18n.git .cache/community
          git -C .cache/community config core.autocrlf false
          git -C .cache/community fetch --quiet --depth 1 origin 99301f35d52a33a940ac9a6bfc1d8e5f5decf67b
          git -C .cache/community checkout --quiet --detach 99301f35d52a33a940ac9a6bfc1d8e5f5decf67b
          git -c core.autocrlf=false clone --quiet --depth 1 --filter=blob:none --sparse --branch v1.23.2 https://github.com/zed-industries/zed.git .cache/official
          git -C .cache/official config core.autocrlf false
          git -C .cache/official sparse-checkout set crates/zed
          python tools/community_bridge.py prepare --toolkit .cache/community --source-root .cache/official --out .cache/test-job --force-source 'Open Project Settings File'
      - name: Frontend build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node ../tools/test_display_locales.js
          node ../tools/test_ui_locales.mjs
      - name: Rust checks
        run: |
          cargo +1.99.0 fmt --all --check
          cargo +1.99.0 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.99.0 test --locked --all-features
          cargo +1.99.0 build --release --locked --all-features --bins
      - name: Native settings SDK and cache integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target=(cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).target_directory
          python tools/test_native_settings.py --binary "$target/release/zed-zh-settings.exe"
      - name: Pinned public source and community validation
        shell: bash
        run: |
          BINARY=$(python -c 'import json,subprocess;from pathlib import Path;print(Path(json.loads(subprocess.check_output(["cargo","metadata","--no-deps","--format-version","1"]))["target_directory"]).as_posix())')/release/zed-zh-addon
          if [ "$RUNNER_OS" = Windows ]; then BINARY="$BINARY.exe"; fi
          python tools/test_ai_pipeline.py --binary "$BINARY" --jobs .cache/test-job/jobs.json --toolkit .cache/community --python python
