name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Rust checks
        run: |
          cargo +1.99.0 fmt --all --check
          cargo +1.99.0 clippy --all-targets --all-features --locked -- -D warnings
          cargo +1.99.0 test --locked --all-features
          cargo +1.99.0 build --locked --features ai
      - name: Prepare pinned public source context
        shell: bash
        run: |
          python -m pip install 'tree-sitter>=0.25,<0.26' 'tree-sitter-rust>=0.24,<0.25'
          git clone --quiet --depth 1 https://github.com/LI-NA/zed-i18n.git .cache/community
          git -C .cache/community fetch --quiet --depth 1 origin 99301f35d52a33a940ac9a6bfc1d8e5f5decf67b
          git -C .cache/community checkout --quiet --detach 99301f35d52a33a940ac9a6bfc1d8e5f5decf67b
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch v1.23.2 https://github.com/zed-industries/zed.git .cache/official
          git -C .cache/official sparse-checkout set crates/zed
          python tools/community_bridge.py prepare --toolkit .cache/community --source-root .cache/official --out .cache/test-job --force-source 'Open Project Settings File'
      - name: Real SDK and community-validator API mock
        shell: bash
        run: |
          BINARY=target/debug/zed-zh-addon
          if [ "$RUNNER_OS" = Windows ]; then BINARY="$BINARY.exe"; fi
          python tools/test_ai_pipeline.py --binary "$BINARY" --jobs .cache/test-job/jobs.json --toolkit .cache/community --python python
          python -m py_compile tools/community_bridge.py tools/update.py tools/test_ai_pipeline.py tools/test_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.os }}
          path: reports/ai-integration.json
