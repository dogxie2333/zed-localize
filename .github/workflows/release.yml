name: Release Windows and Ubuntu packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build Ubuntu package
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 build --release --locked --bin zed-localize-linux
          TARGET=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')
          python tools/collect_licenses.py --toolchain 1.99.0 --target x86_64-unknown-linux-gnu --output /tmp/zed-localize-build/rust-linux-licenses
          VERSION=${GITHUB_REF_NAME#v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION=0.4.0; fi
          python packaging/package-linux.py --binary "$TARGET/release/zed-localize-linux" --rust-licenses /tmp/zed-localize-build/rust-linux-licenses --version "$VERSION"
          dpkg-deb --info "dist/zed-localize_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu24-x86_64
          path: |
            dist/zed-localize_*_amd64.deb
            dist/zed-localize-ubuntu24-x86_64.tar.gz
            dist/SHA256SUMS-linux.txt
      - name: Publish Linux assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for attempt in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/zed-localize_*_amd64.deb dist/zed-localize-ubuntu24-x86_64.tar.gz dist/SHA256SUMS-linux.txt --clobber
              exit 0
            fi
            sleep 10
          done
          exit 1
  package:
    runs-on: windows-latest
    env:
      RUSTC_BOOTSTRAP: dll_syringe
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare compiler
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-gnu --profile minimal
          if(-not (Get-Command windres -ErrorAction SilentlyContinue)){choco install mingw --no-progress -y}
          foreach($dir in @('C:\msys64\mingw64\bin','C:\msys64\ucrt64\bin','C:\Strawberry\c\bin','C:\tools\mingw64\bin')){if(Test-Path -LiteralPath $dir){Add-Content -LiteralPath $env:GITHUB_PATH -Value $dir}}
      - name: Build native portable package
        shell: pwsh
        run: |
          python tools/download_gadget.py
          ./packaging/build-portable.ps1
          $target=(cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).target_directory
          python tools/test_native_settings.py --binary "$target/release/zed-zh-settings.exe"
          python tools/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-windows-x64
          path: |
            dist/Zed-Localize.exe
            dist/zed-localize-windows-x64.zip
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $assets=@('dist/Zed-Localize.exe','dist/zed-localize-windows-x64.zip','dist/SHA256SUMS.txt')
          gh release view $env:GITHUB_REF_NAME 2>$null
          if($LASTEXITCODE -eq 0){gh release upload $env:GITHUB_REF_NAME @assets --clobber;gh release edit $env:GITHUB_REF_NAME --prerelease=false}else{gh release create $env:GITHUB_REF_NAME @assets --title "$env:GITHUB_REF_NAME" --notes '跟随官方 Zed 主线更新，Windows 显示结构自动识别；完整设置页语言与多语言 README，轻量托盘和按需配置，离线显示与可选 AI 批量翻译。Windows EXE / ZIP 与 Ubuntu DEB / tar.gz。自有代码 MIT，社区资源保留原许可。'}
